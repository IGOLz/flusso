name: ✨ Feature request
description: Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: checkboxes
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues (open and closed) and this is not a duplicate.
          required: true

  - type: textarea
    attributes:
      label: What would you like?
      description: Describe the feature and what problem it solves for you.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional information
      description: Optional. Mockups, examples from other dictation apps, etc.
