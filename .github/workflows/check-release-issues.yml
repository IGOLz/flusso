name: Check release automation
on:
  pull_request:
    paths:
      - '.github/workflows/*release-issues.yml'
      - 'scripts/release-issues.cjs'
      - 'Tests/ReleaseIssuesChecks.cjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/*release-issues.yml'
      - 'scripts/release-issues.cjs'
      - 'Tests/ReleaseIssuesChecks.cjs'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node --test Tests/ReleaseIssuesChecks.cjs
