name: Flusso
options:
  bundleIdPrefix: dev.igol
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: 884UZN5CH3
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_CODE_SIGN_FLAGS: --timestamp
    DEAD_CODE_STRIPPING: YES

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1

targets:
  Flusso:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.igol.flusso
        PRODUCT_NAME: Flusso
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Flusso.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: App/Sources/Engine/Flusso-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/build/engine/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/build/engine/lib
        OTHER_LDFLAGS:
          - -ltranscribe
          - -lggml
          - -lggml-metal
          - -lggml-cpu
          - -lggml-base
          - -lc++
        COMBINE_HIDPI_IMAGES: YES
        SPARKLE_FEED_URL: https://github.com/IGOLz/flusso/releases/latest/download/appcast.xml
      configs:
        Release:
          # Notarization rejects the debugger entitlement.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    dependencies:
      - package: Sparkle
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: Accelerate.framework
      - sdk: AVFoundation.framework
      - sdk: CoreAudio.framework
      - sdk: ApplicationServices.framework
      - sdk: ServiceManagement.framework
